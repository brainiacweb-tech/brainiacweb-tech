<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Francis Kusi — Business minded. Builder at heart.</title>
<desc id="desc">A midnight blue banner with mint and gold orbital lines connecting data, code and impact.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#142939"/></linearGradient>
<linearGradient id="line"><stop stop-color="#71F6C5"/><stop offset="1" stop-color="#E8C77B"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#B3DACC" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1280" height="420" rx="24" fill="url(#bg)"/>
<rect width="1280" height="420" rx="24" fill="url(#grid)"/>
<path d="M56 58H100" stroke="#71F6C5" stroke-width="4"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="114" y="64" fill="#71F6C5" font-size="14" font-weight="600" letter-spacing="3">B R A I N I A C W E B</text>
<text x="56" y="151" fill="#F1F7F5" font-size="66" font-weight="700" letter-spacing="-2">Francis Kusi.</text>
<text x="59" y="206" fill="#D9E7E5" font-size="29">Business minded.</text>
<text x="59" y="248" fill="#71F6C5" font-size="29">Builder at heart.</text>
<text x="59" y="302" fill="#A7BBC4" font-size="18">Turning data and everyday problems into useful software.</text>
<text x="59" y="371" fill="#A7BBC4" font-size="13" letter-spacing="2">GHANA / DATA / SOFTWARE / PURPOSE</text>
</g>
<g transform="translate(1000 208)">
<circle r="151" fill="none" stroke="#71F6C5" stroke-opacity=".12"/>
<circle r="112" fill="none" stroke="#71F6C5" stroke-opacity=".2" stroke-dasharray="3 10"/>
<ellipse rx="172" ry="67" transform="rotate(-38)" fill="none" stroke="url(#line)" stroke-opacity=".65"/>
<ellipse rx="172" ry="67" transform="rotate(38)" fill="none" stroke="#71F6C5" stroke-opacity=".25"/>
<path d="M-80-83L85-68L0 105Z" fill="#71F6C5" fill-opacity=".035" stroke="#71F6C5" stroke-opacity=".3"/>
<circle r="56" fill="#102936" stroke="#71F6C5" stroke-opacity=".5"/>
<text text-anchor="middle" y="12" fill="#71F6C5" font-family="Consolas,monospace" font-size="36" font-weight="700">&lt;/&gt;</text>
<g fill="#0D202E" stroke="#71F6C5"><circle cx="-80" cy="-83" r="8"/><circle cx="85" cy="-68" r="8"/><circle cy="105" r="8"/></g>
<g fill="#D9E7E5" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">
<text x="-80" y="-106">DATA</text><text x="85" y="-91">CODE</text><text y="138">IMPACT</text>
</g>
<circle cx="144" cy="-91" r="4" fill="#E8C77B"/>
<circle cx="-144" cy="91" r="4" fill="#71F6C5"/>
</g>
</svg>
